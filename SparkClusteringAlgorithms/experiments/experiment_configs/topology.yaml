# Topologia executorów:
# 1 węzeł, IDENTYCZNY budżet (32 cores, 96GB), różny podział na executory.
# Mierzy: kopie broadcastów, GC pauzy, cross-executor shuffle.
# Spodziewane: KMeans/DBSCAN preferują 1 gruby executor, GridDBSCAN może preferować wiele cienkich.
name: topology

configs_dir: "$SCRATCH/clustering-runs/configs"
output_dir: "$SCRATCH/clustering-runs/results"
log_dir: "$SCRATCH/clustering-runs/logs"
jar_path: "/net/pr2/projects/plgrid/plggclustering25/spark-clustering-benchmark.jar"

sbatch_defaults:
  account: "plgclusteringbigdata-cpu"
  partition: "plgrid"
  walltime: "01:00:00"
  spark_module: "spark/3.3.2-hadoop-3.2-java-11"

evaluation_defaults:
  metrics: ["silhouette", "clusterSizes", "noiseFraction"]
  sampleSize: 10000
  seed: 42

spark_conf_defaults:
  spark.serializer: "org.apache.spark.serializer.KryoSerializer"

matrix:
  nodes: [1]
  resources:
    # Te trzy mają TĘ SAMĄ sumę CPU (32) i RAM (96GB) — testujemy tylko topologię.
    - {cpus_per_task: 32, executors_per_node: 1, mem: "96G"}  # 1 fat   (32c × 96GB)
    - {cpus_per_task: 16, executors_per_node: 2, mem: "96G"}  # 2 medium (16c × 48GB each)
    - {cpus_per_task: 8,  executors_per_node: 4, mem: "96G"}  # 4 thin   (8c  × 24GB each)
    - {cpus_per_task: 4,  executors_per_node: 8, mem: "96G"}  # 8 micro  (4c  × 12GB each)
  algorithm:
    - {name: kmeans, params: {k: 100, maxIter: 100, distance: euclidean}}  # k duże -> duży broadcast
    - {name: dbscan, params: {eps: 0.5, minPts: 5, variant: grid, distance: euclidean}}
  dataset:
    - {type: synthetic, params: {numPoints: 5000000, numPartitions: 128}}

repetitions: 5