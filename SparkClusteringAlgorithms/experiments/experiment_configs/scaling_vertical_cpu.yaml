name: scaling-vertical-cpu-001

configs_dir: "$SCRATCH/clustering-runs/configs"
output_dir: "$SCRATCH/clustering-runs/results"
log_dir: "$SCRATCH/clustering-runs/logs"
jar_path: "/net/pr2/projects/plgrid/plggclustering25/spark-clustering-benchmark.jar"

sbatch_defaults:
  account: "plgclusteringbigdata-cpu"
  partition: "plgrid"
  walltime: "01:00:00"
  spark_module: "spark/3.3.2-hadoop-3.2-java-11"

evaluation_defaults:
  metrics: ["silhouette", "clusterSizes", "noiseFraction"]
  sampleSize: 10000
  seed: 42

spark_conf_defaults:
  spark.serializer: "org.apache.spark.serializer.KryoSerializer"

matrix:
  nodes: [1]
  resources:
    - {cpus_per_task: 4,  executors_per_node: 1, mem: "96G"}
    - {cpus_per_task: 8,  executors_per_node: 1, mem: "96G"}
    - {cpus_per_task: 16, executors_per_node: 1, mem: "96G"}
    - {cpus_per_task: 32, executors_per_node: 1, mem: "96G"}
  algorithm:
    - {name: kmeans, params: {k: 10, maxIter: 100, distance: euclidean}}
    - {name: dbscan, params: {eps: 0.5, minPts: 5, variant: grid, distance: euclidean}}
  dataset:
    - {type: synthetic, params: {numPoints: 5000000, numPartitions: 128}}

repetitions: 5
