# Skalowalność PIONOWA (memory sensitivity):
# 1 węzeł, stałe CPU, rosnąca pamięć.
# Mierzy: gdzie zaczyna się spill na dysk, kiedy cache RDD wpada w OOM,
# limity collect() dla FastPAM.
name: scaling-vertical-mem

configs_dir: "$SCRATCH/clustering-runs/configs"
output_dir: "$SCRATCH/clustering-runs/results"
log_dir: "$SCRATCH/clustering-runs/logs"
jar_path: "/net/pr2/projects/plgrid/plggclustering25/spark-clustering-benchmark.jar"

sbatch_defaults:
  account: "plgclusteringbigdata-cpu"
  partition: "plgrid"
  walltime: "01:00:00"
  spark_module: "spark/3.3.2-hadoop-3.2-java-11"

evaluation_defaults:
  metrics: ["silhouette", "clusterSizes", "noiseFraction"]
  sampleSize: 10000
  seed: 42

spark_conf_defaults:
  spark.serializer: "org.apache.spark.serializer.KryoSerializer"

matrix:
  nodes: [1]
  resources:
    - {cpus_per_task: 16, executors_per_node: 1, mem: "24G"}
    - {cpus_per_task: 16, executors_per_node: 1, mem: "48G"}
    - {cpus_per_task: 16, executors_per_node: 1, mem: "96G"}
    - {cpus_per_task: 16, executors_per_node: 1, mem: "180G"}
  algorithm:
    - {name: kmeans,  params: {k: 10, maxIter: 100, distance: euclidean}}
    - {name: fastpam, params: {k: 10, maxIter: 100, distance: euclidean}}
  dataset:
    - {type: synthetic, params: {numPoints: 2000000, numPartitions: 128}}

repetitions: 5