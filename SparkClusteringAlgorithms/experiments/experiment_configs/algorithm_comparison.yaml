# Porównanie ALGORYTMÓW (rodzina + wariant naiwny vs zoptymalizowany):
# stałe zasoby i węzły, zmienne algorytmy i zbiory danych.
# Mierzy: time-to-solution per rodzina, naive vs optimized speedup, silhouette quality.
name: algorithm-comparison

configs_dir: "$SCRATCH/clustering-runs/configs"
output_dir: "$SCRATCH/clustering-runs/results"
log_dir: "$SCRATCH/clustering-runs/logs"
jar_path: "/net/pr2/projects/plgrid/plggclustering25/spark-clustering-benchmark.jar"

sbatch_defaults:
  account: "plgclusteringbigdata-cpu"
  partition: "plgrid"
  walltime: "02:00:00"
  spark_module: "spark/3.3.2-hadoop-3.2-java-11"

evaluation_defaults:
  metrics: ["silhouette", "clusterSizes", "noiseFraction"]
  sampleSize: 10000
  seed: 42

spark_conf_defaults:
  spark.serializer: "org.apache.spark.serializer.KryoSerializer"

matrix:
  nodes: [4]
  resources:
    - {cpus_per_task: 16, executors_per_node: 1, mem: "96G"}
  algorithm:
    # Centroidy
    - {name: kmeans,  params: {k: 10, maxIter: 100, distance: euclidean}}
    # Medoidy: naiwny -> zoptymalizowany
    - {name: pam,     params: {k: 10, maxIter: 100, distance: euclidean}}
    - {name: fastpam, params: {k: 10, maxIter: 100, distance: euclidean}}
    - {name: clara,   params: {k: 10, maxIter: 100, numSamples: 5, sampleSize: 1000, distance: euclidean}}
    # Gęstościowe: naiwny -> zoptymalizowany
    - {name: dbscan,  params: {eps: 0.5, minPts: 5, variant: naive, distance: euclidean}}
    - {name: dbscan,  params: {eps: 0.5, minPts: 5, variant: grid,  distance: euclidean}}
  dataset:
    - {type: synthetic, params: {numPoints: 100000,   numPartitions: 64}}
    - {type: synthetic, params: {numPoints: 1000000,  numPartitions: 128}}
    - {type: synthetic, params: {numPoints: 10000000, numPartitions: 256}}

repetitions: 5